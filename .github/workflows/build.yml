name: Build & Deploy HackerOS Website

# Strona jest napisana w 100% w HackerScript (use <mode:website>). Workflow pobiera hackerc i bit,
# buduje stronę komendą `bit site` (scripts/build-site.lua, Lua) i wdraża paczkę _site na GitHub Pages.
#
# Wymagane jednorazowo: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz; nowsze anuluje oczekujące (nie przerywa trwającego deployu).
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_DIR: _site
  HACKERC_URL: https://github.com/HackerOS-Linux-System/HackerScript/releases/download/v0.5/hackerc
  BIT_URL: https://github.com/HackerOS-Linux-System/bit/releases/download/v0.2/bit
  # Strony 404/offline ładują skrypt ścieżką bezwzględną (GitHub Pages "project site").
  SITE_BASE: /${{ github.event.repository.name }}/

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download hackerc and bit
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tools/hackerc" "$HACKERC_URL"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tools/bit" "$BIT_URL"
          chmod +x "$RUNNER_TEMP/tools/hackerc" "$RUNNER_TEMP/tools/bit"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          lua -v

      - name: Tool versions
        run: |
          hackerc --version
          bit --version

      - name: Build site (bit site -> hackerc build)
        env:
          BIT_HACKERC: ${{ runner.temp }}/tools/hackerc
          HACKERC: ${{ runner.temp }}/tools/hackerc
          OUT: ${{ env.SITE_DIR }}
        run: |
          set -e
          bit site
          test -f "$SITE_DIR/index.html"
          test -f "$SITE_DIR/404.html"
          test -f "$SITE_DIR/offline.html"
          test -f "$SITE_DIR/sw.js"
          echo "Rozmiar paczki:"; du -sh "$SITE_DIR"
          echo "Liczba plików: $(find "$SITE_DIR" -type f | wc -l)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate generated JavaScript syntax
        run: |
          set -e
          count=0
          while IFS= read -r -d '' f; do
            node --check "$f" || { echo "::error file=$f::Błąd składni wygenerowanego JavaScript"; exit 1; }
            count=$((count + 1))
          done < <(find "$SITE_DIR" -type f -name '*.js' -print0)
          echo "Sprawdzono plików JS: $count"

      - name: Check internal links (warnings only)
        shell: python
        run: |
          import os, re
          from urllib.parse import unquote

          PAGES = "cmd/pages"
          SKIP = ("http://", "https://", "//", "#", "mailto:", "tel:", "javascript:", "data:", "/cdn-cgi/")
          # markup stron siedzi w stałych tekstowych .hcs: href=\"...\" / src=\"...\"
          attr = re.compile(r'''(?:href|src)\s*=\s*\\?["']([^"'\\]+)''', re.I)
          missing = 0
          stubs = []
          for dp, dn, fn in os.walk(PAGES):
              for name in fn:
                  if not name.endswith(".hcs"):
                      continue
                  path = os.path.join(dp, name)
                  text = open(path, encoding="utf-8", errors="ignore").read()
                  if 'boot_begin("", "")' in text:
                      stubs.append(path)
                      continue
                  pagedir = os.path.relpath(dp, PAGES)
                  for link in attr.findall(text):
                      link = link.strip()
                      if not link or link.startswith(SKIP) or "{{" in link or "${" in link:
                          continue
                      target = unquote(re.split(r"[?#]", link)[0])
                      if not target:
                          continue
                      base = "." if target.startswith("/") else pagedir
                      rel = os.path.normpath(os.path.join(base, target.lstrip("/")))
                      ok = (os.path.exists(os.path.join(os.environ["SITE_DIR"], rel))
                            or os.path.exists(os.path.join(os.environ["SITE_DIR"], rel + ".html")))
                      if not ok:
                          missing += 1
                          print(f"::warning file={path}::Brak pliku dla linku: {link}")
          for p in stubs:
              print(f"::warning file={p}::Pusta strona-szkielet")
          print(f"Niedziałające linki: {missing}, puste strony: {len(stubs)}")

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    name: Deploy to GitHub Pages
    # Pull requesty tylko budują i walidują – bez publikacji.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
